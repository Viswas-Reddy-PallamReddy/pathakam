[project]
name = "pathakam"
version = "0.1.0"
description = "Telugu/English helpdesk for Andhra Pradesh and Telangana welfare schemes, answering only from official documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pathakam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
