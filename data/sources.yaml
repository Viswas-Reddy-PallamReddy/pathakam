#   as_of:        GO / notification date, so stale rules can be flagged
#
# Example (replace with real, verified official links):
#
# - file: example-scheme-guidelines-2025.pdf
#   id: example-scheme-guidelines-2025
#   title: Example Scheme operational guidelines (G.O. Ms. No. __, 2025)
#   scheme: Example Scheme
#   state: AP
#   language: te
#   source_url: https://<official-department-site>/guidelines.pdf
#   as_of: 2025-06-01

