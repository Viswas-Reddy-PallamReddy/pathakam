# Official documents the assistant answers from. Add only government sources
# (GO PDFs, scheme guidelines, official portal FAQ pages saved as text).
#
#   file:         name inside data/raw/ (required)
#   id:           stable document id (default: slug of the file name)
#   title:        shown in citations
#   scheme:       scheme name, for filtering later
#   state:        AP | TS
#   language:     te | en | mixed
#   source_url:   official page or PDF that citations link to
